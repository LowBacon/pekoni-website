name: Deploy Pekoni to GitHub Pages

# Publishes the static export (npm run build:static) to GitHub Pages.
#
# That build has no server: accounts, balances and game results live in each
# visitor's browser. For the real product — server-authoritative economy,
# database, sessions — deploy `npm run build` to a Node host instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # The server modules are still type-checked and bundled during the
        # static build, so the generated client has to exist.
        run: npx prisma generate

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing, so a
          # fresh fork deploys without anyone visiting the settings page. It is
          # a no-op once the site exists.
          enablement: true

      - name: Build static export
        env:
          # A project site is served from /<repo>, a user/org site from /.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
